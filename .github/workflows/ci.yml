name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned, not floating on `latest`, so a toolchain release cannot turn a green
# repo red overnight without a commit that says so. Follows the pinning shape
# the contracts repo uses for FOUNDRY_VERSION. Note this is the first pinned bun
# version in the org - backend omits `bun-version` entirely and frontend sets it
# to `latest`, so there was no existing pin to match.
env:
  BUN_VERSION: "1.3.4"
  NODE_VERSION: "22"

jobs:
  ci:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # npm, not `bun install`: this repo's lockfile is package-lock.json and
      # there is no bun.lock, so `bun install --frozen-lockfile` would fail and a
      # plain `bun install` would write a second, competing lockfile. Bun is here
      # as the test runner only - the package manager stays npm.
      #
      # --ignore-scripts skips playwright's browser download (~150MB). Nothing in
      # the typecheck or these tests launches a browser; the Dockerfile installs
      # the browser into the runtime image, which is where it is actually needed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      # tsconfig.json's `include` is src-only, so without this the test files
      # would never be typechecked by anything.
      - name: Typecheck tests
        run: bunx tsc --noEmit -p tsconfig.test.json

      # No secrets, no RPC, no .env, no network. Every test stubs the on-chain
      # read through setMaxSourceDateAgeReader, so the live-chain path is never
      # exercised here. A test that genuinely needs a diamond to talk to does not
      # belong in this workflow - it needs a local devnet job of its own.
      - name: Test
        run: bun test
